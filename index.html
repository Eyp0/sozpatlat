<body>
  <div class="container">
    <h1>Söz Patlat!</h1>
    <p>Espri mi? Deyim mi? Atasözü mü? Patlat bir tane!</p>

    <div class="kategori-container">
      <button class="kategori-btn" onclick="kategoriSec('espri')">Espri</button>
      <button class="kategori-btn" onclick="kategoriSec('atasozu')">Atasözü</button>
      <button class="kategori-btn" onclick="kategoriSec('deyim')">Deyim</button>
      <button class="kategori-btn" onclick="kategoriSec('romantik')">Romantik</button>
      <button class="kategori-btn" onclick="kategoriSec('bilimsel')">Bilimsel</button>
    </div>

    <button id="rastgeleBtn" onclick="rastgeleSozGetir()">Rastgele Söyle</button>
    
    <div id="sonuc">
      <div class="sonuc-icerik">
        <span id="sozMetni">Bir kategori seç ve butona bas!</span>
        <span id="anlamIkonu" class="anlam-ikonu" style="display: none;">?</span>
        <div id="anlamAciklama" class="anlam-aciklama" style="display: none;"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <p>&copy; 2025 Söz Patlat! - Tüm Hakları Saklıdır</p>
      <p class="developer-info">Geliştirici: <a href="https://github.com/Eyp0" target="_blank" rel="noopener noreferrer">Eyüp Korkmaz</a></p>
    </div>
  </footer>

  <script>
    let sozler = {};
    let seciliKategori = null;
    let jsonYuklendi = false;

    document.addEventListener('DOMContentLoaded', function() {
      fetch('sozler.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('JSON dosyası bulunamadı');
          }
          return response.json();
        })
        .then(data => {
          console.log('JSON yüklendi:', data);
          sozler = data;
          jsonYuklendi = true;
        })
        .catch(error => {
          console.error('JSON yükleme hatası:', error);
          document.getElementById('sonuc').innerHTML = '<div class="sonuc-icerik"><span>Sözler yüklenirken bir hata oluştu: ' + error.message + '</span></div>';
        });
    });

    function kategoriSec(kategori) {
      console.log('Seçilen kategori:', kategori);
      seciliKategori = kategori;
      document.querySelectorAll('.kategori-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function rastgeleSozGetir() {
      if (!jsonYuklendi) {
        document.getElementById('sonuc').innerHTML = '<div class="sonuc-icerik"><span>Sözler henüz yüklenmedi, lütfen bekleyin...</span></div>';
        return;
      }
      
      if (!seciliKategori) {
        document.getElementById('sonuc').innerHTML = '<div class="sonuc-icerik"><span>Lütfen önce bir kategori seç!</span></div>';
        return;
      }
      
      if (!sozler[seciliKategori]) {
        document.getElementById('sonuc').innerHTML = '<div class="sonuc-icerik"><span>Seçilen kategoride söz bulunamadı!</span></div>';
        return;
      }

      let rastgele;
      const liste = sozler[seciliKategori].sozler;
      rastgele = liste[Math.floor(Math.random() * liste.length)];
      const anlam = sozler[seciliKategori].anlamlar[rastgele] || 'Anlam bulunamadı.';
      document.getElementById('sonuc').innerHTML = `
        <div class="sonuc-icerik">
          <span id="sozMetni">${rastgele}</span>
          <span id="anlamIkonu" class="anlam-ikonu">?</span>
          <div id="anlamAciklama" class="anlam-aciklama">${anlam}</div>
        </div>
      `;
      
      document.getElementById('anlamIkonu').addEventListener('click', function() {
        const anlamAciklama = document.getElementById('anlamAciklama');
        anlamAciklama.style.display = anlamAciklama.style.display === 'none' ? 'block' : 'none';
      });
    }
  </script>
