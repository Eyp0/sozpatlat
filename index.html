<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Espri, atasözü ve deyimler için rastgele sözler patlatın! Eğlenceli ve öğretici içerikler için Söz Patlat!">
  <meta name="keywords" content="espri, atasözü, deyim, söz, rastgele, eğlence, Türkçe">
  <meta name="author" content="Eyüp Korkmaz">
  <meta name="robots" content="index, follow">
  <title>Söz Patlat!</title>
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CYJ33W0H8X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CYJ33W0H8X');
  </script>
</head>
<body>
  <div class="container">
    <h1>Söz Patlat!</h1>
    <p>Espri mi? Deyim mi? Atasözü mü? Patlat bir tane!</p>

    <div class="kategori-container">
      <button class="kategori-btn" onclick="kategoriSec('espri')">Espri</button>
      <button class="kategori-btn" onclick="kategoriSec('atasozu')">Atasözü</button>
      <button class="kategori-btn" onclick="kategoriSec('deyim')">Deyim</button>
    </div>

    <button id="rastgeleBtn" onclick="rastgeleSozGetir()">Rastgele Söyle</button>
    
    <div id="sonuc">Bir kategori seç ve butona bas!</div>
  </div>

  <footer>
    <div class="footer-content">
      <p>&copy; 2025 Söz Patlat! - Tüm Hakları Saklıdır</p>
      <p class="developer-info">Geliştirici: <a href="https://github.com/Eyp0" target="_blank" rel="noopener noreferrer">Eyüp Korkmaz</a></p>
    </div>
  </footer>

  <script>
    let sozler = {};
    let seciliKategori = null;

    // Sayfa yüklendiğinde JSON'ı yükle
    document.addEventListener('DOMContentLoaded', function() {
      fetch('sozler.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('JSON dosyası bulunamadı');
          }
          return response.json();
        })
        .then(data => {
          console.log('JSON yüklendi:', data);
          sozler = data;
        })
        .catch(error => {
          console.error('JSON yükleme hatası:', error);
          document.getElementById('sonuc').textContent = 'Sözler yüklenirken bir hata oluştu: ' + error.message;
        });
    });

    function kategoriSec(kategori) {
      console.log('Seçilen kategori:', kategori);
      seciliKategori = kategori;
      document.querySelectorAll('.kategori-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function rastgeleSozGetir() {
      console.log('Mevcut sözler:', sozler);
      console.log('Seçili kategori:', seciliKategori);
      
      if (!seciliKategori) {
        document.getElementById('sonuc').textContent = 'Lütfen önce bir kategori seç!';
        return;
      }
      
      if (!sozler[seciliKategori]) {
        document.getElementById('sonuc').textContent = 'Seçilen kategoride söz bulunamadı!';
        return;
      }

      const liste = sozler[seciliKategori];
      const rastgele = liste[Math.floor(Math.random() * liste.length)];
      document.getElementById('sonuc').textContent = rastgele;
    }
  </script>
</body>
</html>
